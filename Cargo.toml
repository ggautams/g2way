[workspace]
resolver = "2"
members = [
    "crates/g2-core",
    "crates/g2-storage",
    "crates/g2-proxy",
    "crates/g2-middleware",
    "crates/g2-admin",
    "crates/g2-telemetry",
    "crates/g2-plugin",
    "crates/g2way",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MPL-2.0"
repository = "https://github.com/g2way/g2way"
rust-version = "1.85"

[workspace.dependencies]
# Intra-workspace crates
g2-core = { path = "crates/g2-core" }
g2-storage = { path = "crates/g2-storage" }
g2-proxy = { path = "crates/g2-proxy" }
g2-middleware = { path = "crates/g2-middleware" }
g2-admin = { path = "crates/g2-admin" }
g2-telemetry = { path = "crates/g2-telemetry" }
g2-plugin = { path = "crates/g2-plugin" }

# Async runtime & HTTP
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal", "time", "sync", "fs", "io-util"] }
hyper = { version = "1", features = ["http1", "http2", "server", "client"] }
hyper-util = { version = "0.1", features = ["server-auto", "server-graceful", "client-legacy", "http1", "http2", "tokio"] }
http = "1"
http-body = "1"
http-body-util = "0.1"
bytes = "1"
tower = { version = "0.5", features = ["util"] }
axum = "0.8"

# GraphQL (schema/query parsing and spec validation — ADR-0004)
apollo-compiler = "1"

# WASM plugin runtime (ADR-0005). Pinned to major 33: 34+ raises wasmtime's
# MSRV past our `rust-version = 1.85`. Trimmed features only — none of these
# need cmake (the rust:1-slim Docker build stage has gcc but no cmake).
wasmtime = { version = "33", default-features = false, features = ["runtime", "cranelift", "std"] }

# Body-transform template engine (ADR-0007). Pure Rust, MSRV 1.70, no native
# deps (the rust:1-slim Docker build stage has no cmake). Trimmed features:
# no `multi_template` on purpose — templates are self-contained
# (`include`/`extends` become config-time syntax errors); `json` supplies the
# `tojson` filter; `fuel` bounds render cost per request.
minijinja = { version = "2", default-features = false, features = ["builtins", "serde", "json", "fuel"] }

# Data / config
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
arc-swap = "1"
ipnet = "2"
regex = "1"
redis = { version = "1.6", features = ["tokio-comp", "connection-manager"] }
futures-util = { version = "0.3", default-features = false }

# TLS (upstream https support — ADR-0001 consequence, M7). `ring` provider
# everywhere: aws-lc-rs needs cmake, which the rust:1-slim Docker build
# stage does not carry.
hyper-rustls = { version = "0.27", default-features = false, features = ["http1", "http2", "ring", "tls12", "native-tokio", "webpki-tokio", "logging"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "logging", "std", "tls12"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["logging", "tls12", "ring"] }

# Crypto / hashing
sha2 = "0.10"
hmac = "0.12"
httpdate = "1"
hex = "0.4"
rand = "0.9"
jsonwebtoken = { version = "10", features = ["rust_crypto"] }
bcrypt = "0.17"
base64 = "0.22"

# OpenAPI
utoipa = "5"

# OpenTelemetry (OTLP trace/metric export; see ADR-0001 decision 3)
opentelemetry = "0.32"
opentelemetry_sdk = "0.32"
opentelemetry-otlp = { version = "0.32", default-features = false, features = [
    "trace",
    "metrics",
    "logs",
    "http-proto",
    "reqwest-blocking-client",
    "internal-logs",
] }
opentelemetry-prometheus = "0.32"
prometheus = { version = "0.14", default-features = false }
tracing-opentelemetry = "0.33"

# Errors, logging, CLI
thiserror = "2"
async-trait = "0.1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
clap = { version = "4", features = ["derive", "env"] }

# Dev-dependencies
tempfile = "3"
rcgen = { version = "0.13", default-features = false, features = ["crypto", "pem", "ring"] }
# Tests author WASM guest plugins as inline WAT text — no wasm32 toolchain
# needed for `make check` (ADR-0005).
wat = "1"

[workspace.lints.rust]
missing_docs = "warn"
unsafe_code = "deny"

[workspace.lints.clippy]
dbg_macro = "warn"
todo = "warn"

[profile.release]
lto = "thin"
codegen-units = 1
