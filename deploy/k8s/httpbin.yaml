# Sample upstream: go-httpbin (multi-arch, works on Apple Silicon minikube).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: httpbin
  namespace: g2way
  labels:
    app: httpbin
spec:
  replicas: 1
  selector:
    matchLabels:
      app: httpbin
  template:
    metadata:
      labels:
        app: httpbin
    spec:
      containers:
        - name: httpbin
          image: ghcr.io/mccutchen/go-httpbin:v2
          ports:
            - containerPort: 8080
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 128Mi
---
apiVersion: v1
kind: Service
metadata:
  name: httpbin
  namespace: g2way
spec:
  selector:
    app: httpbin
  ports:
    - port: 8080
      targetPort: 8080
