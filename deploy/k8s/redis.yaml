# Redis: shared storage for API keys and rate-limit/quota counters.
# No persistence — smoke-test state is disposable; real deployments should
# point G2_REDIS_URL at a managed/persistent Redis instead.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: g2way
  labels:
    app: redis
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        app: redis
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          ports:
            - containerPort: 6379
          readinessProbe:
            exec:
              command: ["redis-cli", "ping"]
            periodSeconds: 5
          resources:
            requests:
              cpu: 50m
              memory: 32Mi
            limits:
              memory: 128Mi
---
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: g2way
spec:
  selector:
    app: redis
  ports:
    - port: 6379
      targetPort: 6379
